[package]
name = "native-jit"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "S2 prototype: minimal Cranelift baseline JIT for numeric kernels (fib + an n-body-morphic f64 array kernel), benchmarked against LLVM-optimized Rust in the same process."

# V2-S0-D (docs/design/NEXT.md): the MAIN operon crate stays
# zero-external-crates; this is a standalone crate with its own lockfile,
# following the examples/embed/ pattern. Nothing in the toolchain depends on
# it yet — it is the evidence generator for the S2 native gate.

[dependencies]
cranelift-codegen = "0.137"
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
